name: SentinelCI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  security:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    name: Build and Scan
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::660741725500:role/SentinelCI-GitHubActions
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Build Docker image
        run: |
          docker build -t sentinel-ci:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sentinel-ci:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sentinel-ci:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-ci-sbom
          path: sbom.json

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/sentinel-ci:${{ github.sha }}
          docker tag sentinel-ci:${{ github.sha }} $IMAGE
          docker push $IMAGE
          echo "IMAGE_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE)" >> $GITHUB_ENV

      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cosign sign --yes $IMAGE_DIGEST

      - name: Verify container image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: sentinel-ci
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cosign verify \
            $REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/tarunkay7/sentinel-ci/.github/workflows/.*@refs/heads/main"
      
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -var="image_tag=${{ github.sha }}

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${{ github.sha }}"

      - name: Deploy to ECS
        env:
          AWS_REGION: ap-south-1
          ECS_CLUSTER: sentinel-ci
          ECS_SERVICE: sentinel-ci
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Deploying image: $IMAGE_TAG"

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE
        
